<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BharatBazaro</title>
  <script>
    (function () {
      var m = location.pathname.match(/\/(?:a|go)\/([A-Za-z0-9]{10})\/?$/);
      if (!m) return;
      var asin = m[1].toUpperCase();
      var params = new URLSearchParams(location.search);
      var rawSub = params.get('subtag') || (params.get('channel') ? 'bb-' + params.get('channel') : 'bb-short');
      var subtag = encodeURIComponent(rawSub.replace(/[^a-zA-Z0-9_\-]/g, '').slice(0, 50) || 'bb-short');

      if (navigator.sendBeacon) {
        try {
          navigator.sendBeacon('/api/track-click', JSON.stringify({
            asin: asin,
            subtag: subtag,
            source: 'shortlink_redirect',
            ref: document.referrer || '',
            timestamp: new Date().toISOString()
          }));
        } catch (_) {}
      }

      location.replace(
        "https://www.amazon.in/dp/" + asin +
        "?tag=dammaiprasad-21&linkCode=ll1&ascsubtag=" + subtag
      );
    })();
  </script>
</head>
<body style="font-family: system-ui, sans-serif; background:#0e0d0b; color:#f4efe6; padding:32px;">
  <p id="msg">Page not found. <a href="/" style="color:#ef6a1a">Back to BharatBazaro</a></p>
  <script>
    if (/\/(?:a|go)\/[A-Za-z0-9]{10}/.test(location.pathname)) {
      document.getElementById("msg").textContent = "Opening Amazon…";
    }
  </script>
</body>
</html>
